<svg width="680" height="650" viewBox="0 0 680 650" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>Network security architecture with AWS Shield, WAF, and VPC segmentation</title>
<desc>Traffic flows from the internet through AWS Shield, then AWS WAF, into a VPC containing a public subnet with an ALB and security group, and a private subnet with an app tier and security group, all bounded by a stateless NACL.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="650" fill="#0d1117"/>

<text x="340" y="30" text-anchor="middle" fill="#c9c9c9" font-size="14" font-weight="600">Internet</text>
<line x1="340" y1="40" x2="340" y2="64" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="220" y="64" width="240" height="56" rx="8" fill="#4A1B0C" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="82" text-anchor="middle" fill="#F5C4B3" font-size="14" font-weight="600">AWS Shield</text>
<text x="340" y="102" text-anchor="middle" fill="#F0997B" font-size="12">Always-on DDoS protection</text>
<line x1="340" y1="120" x2="340" y2="144" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="144" width="280" height="56" rx="8" fill="#412402" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="162" text-anchor="middle" fill="#FAC775" font-size="14" font-weight="600">AWS WAF</text>
<text x="340" y="182" text-anchor="middle" fill="#EF9F27" font-size="12">Web ACL — Layer 7 inspection</text>
<line x1="340" y1="200" x2="340" y2="224" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="224" width="600" height="380" rx="20" fill="#173404" stroke="#3B6D11" stroke-width="0.5"/>
<text x="60" y="256" fill="#C0DD97" font-size="14" font-weight="600">VPC — 10.0.0.0/16</text>

<rect x="70" y="282" width="540" height="28" rx="6" fill="#26215C" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="300" text-anchor="middle" fill="#AFA9EC" font-size="12">Network ACL — stateless, subnet-level</text>

<rect x="70" y="326" width="540" height="120" rx="12" fill="#042C53" stroke="#185FA5" stroke-width="0.5"/>
<text x="90" y="346" fill="#85B7EB" font-size="14" font-weight="600">Public Subnet — 10.0.0.0/24</text>

<rect x="100" y="368" width="160" height="44" rx="8" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="180" y="394" text-anchor="middle" fill="#D3D1C7" font-size="14">ALB (public)</text>

<rect x="284" y="368" width="300" height="44" rx="8" fill="#412402" stroke="#854F0B" stroke-width="0.5"/>
<text x="434" y="394" text-anchor="middle" fill="#FAC775" font-size="14">Security group — 443 only</text>

<line x1="180" y1="412" x2="180" y2="504" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="70" y="462" width="540" height="120" rx="12" fill="#042C53" stroke="#185FA5" stroke-width="0.5"/>
<text x="90" y="482" fill="#85B7EB" font-size="14" font-weight="600">Private App Subnet — 10.0.10.0/24</text>

<rect x="100" y="504" width="160" height="44" rx="8" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="180" y="530" text-anchor="middle" fill="#D3D1C7" font-size="14">App tier</text>

<rect x="284" y="504" width="300" height="44" rx="8" fill="#412402" stroke="#854F0B" stroke-width="0.5"/>
<text x="434" y="530" text-anchor="middle" fill="#FAC775" font-size="14">SG: allow from ALB-SG only</text>

<circle cx="55" cy="630" r="5" fill="#993C1D"/><text x="66" y="634" fill="#B4B2A9" font-size="12">Edge protection</text>
<circle cx="185" cy="630" r="5" fill="#854F0B"/><text x="196" y="634" fill="#B4B2A9" font-size="12">Security</text>
<circle cx="280" cy="630" r="5" fill="#185FA5"/><text x="291" y="634" fill="#B4B2A9" font-size="12">Subnet</text>
<circle cx="365" cy="630" r="5" fill="#534AB7"/><text x="376" y="634" fill="#B4B2A9" font-size="12">Access control</text>
<circle cx="490" cy="630" r="5" fill="#5F5E5A"/><text x="501" y="634" fill="#B4B2A9" font-size="12">Compute</text>
</svg>
