<svg width="960" height="420" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="420" rx="14" fill="#14161B"/>
  <text x="480" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#F2F2F0">Hybrid Network — Direct Connect</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#9A9A96">Module 06 — What You're Building</text>

  <rect x="30" y="100" width="180" height="120" rx="10" fill="#181A22" stroke="#847E96" stroke-width="1.2"/>
  <text x="120" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#C7C7C2">On-Premises Router</text>
  <rect x="46" y="132" width="148" height="24" rx="8" fill="#2A2312" stroke="#B98A2E" stroke-width="0.8"/>
  <text x="120" y="148" text-anchor="middle" font-size="9" fill="#E2B04E">⚿ LOA-CFA</text>
  <text x="120" y="182" text-anchor="middle" font-size="8" fill="#847E96">Authorizes physical</text>
  <text x="120" y="194" text-anchor="middle" font-size="8" fill="#847E96">cross-connect install</text>

  <line x1="210" y1="160" x2="260" y2="160" stroke="#6B6B66" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="235" y="150" text-anchor="middle" font-size="8" fill="#9A9A96">dedicated fiber</text>

  <rect x="260" y="90" width="200" height="140" rx="10" fill="#241708" stroke="#B0672A" stroke-width="1.2"/>
  <text x="280" y="112" font-size="11" font-weight="bold" fill="#E2924C">◱ DX Location</text>
  <text x="280" y="128" font-size="9" fill="#F0A96A">Colocation facility</text>
  <rect x="276" y="138" width="168" height="24" rx="8" fill="#2A1608" stroke="#B0672A" stroke-width="0.8"/>
  <text x="360" y="154" text-anchor="middle" font-size="9" fill="#E2924C">Connection (1/10/100 Gbps)</text>
  <rect x="276" y="168" width="168" height="24" rx="8" fill="#2A1608" stroke="#B0672A" stroke-width="0.8"/>
  <text x="360" y="184" text-anchor="middle" font-size="9" fill="#E2924C">BGP Session — Established</text>
  <text x="360" y="212" text-anchor="middle" font-size="8" fill="#C79063">dynamic routing over the link</text>

  <line x1="460" y1="160" x2="510" y2="160" stroke="#6B6B66" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="485" y="150" text-anchor="middle" font-size="8" fill="#9A9A96">VLAN-tagged</text>

  <rect x="510" y="90" width="190" height="140" rx="10" fill="#0E1A24" stroke="#3A6EA5" stroke-width="1.2"/>
  <text x="530" y="112" font-size="11" font-weight="bold" fill="#7FB2E8">⧉ Virtual Interface</text>
  <text x="530" y="128" font-size="9" fill="#9BB9D6">Private / Public / Transit</text>
  <rect x="526" y="138" width="158" height="24" rx="8" fill="#0E2C4A" stroke="#3A6EA5" stroke-width="0.8"/>
  <text x="605" y="154" text-anchor="middle" font-size="9" fill="#7FB2E8">1 physical → many VIFs</text>
  <text x="605" y="182" text-anchor="middle" font-size="8" fill="#9A9A96">carries traffic to AWS</text>

  <line x1="700" y1="160" x2="740" y2="160" stroke="#6B6B66" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="740" y="90" width="190" height="140" rx="10" fill="#1A1526" stroke="#7A5CC7" stroke-width="1.2"/>
  <text x="760" y="112" font-size="11" font-weight="bold" fill="#A98FE0">◈ Direct Connect GW</text>
  <text x="760" y="128" font-size="9" fill="#C6B4EE">Global — multi-VPC/region</text>
  <rect x="756" y="138" width="158" height="24" rx="8" fill="#241534" stroke="#7A5CC7" stroke-width="0.8"/>
  <text x="835" y="154" text-anchor="middle" font-size="9" fill="#A98FE0">→ VGW / TGW → VPC(s)</text>
  <text x="835" y="182" text-anchor="middle" font-size="8" fill="#847E96">without DXGW: 1 VIF = 1 VPC</text>

  <rect x="260" y="260" width="360" height="46" rx="8" fill="#181A22" stroke="#847E96" stroke-width="0.8"/>
  <text x="440" y="280" text-anchor="middle" font-size="9" font-weight="bold" fill="#C7C7C2">Note: DX is not encrypted by default</text>
  <text x="440" y="296" text-anchor="middle" font-size="8" fill="#9A9A96">layer IPsec VPN or MACsec if encryption is required</text>

  <circle cx="70" cy="360" r="5" fill="#847E96"/><text x="82" y="364" font-size="9" fill="#C7C7C2">On-prem</text>
  <circle cx="200" cy="360" r="5" fill="#B0672A"/><text x="212" y="364" font-size="9" fill="#C7C7C2">DX physical layer</text>
  <circle cx="390" cy="360" r="5" fill="#3A6EA5"/><text x="402" y="364" font-size="9" fill="#C7C7C2">Logical interface</text>
  <circle cx="570" cy="360" r="5" fill="#7A5CC7"/><text x="582" y="364" font-size="9" fill="#C7C7C2">Gateway / routing</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9A9A96"/>
    </marker>
  </defs>
</svg>
