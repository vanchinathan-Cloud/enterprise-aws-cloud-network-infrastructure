<svg viewBox="0 0 1000 1400" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
.layer-box { stroke: #2c3e50; stroke-width: 2; }
.layer-title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: white; }
.layer-desc { font-family: Arial, sans-serif; font-size: 12px; fill: white; }
.section-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #2c3e50; }
.arrow { stroke: #7f8c8d; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
</style>
<marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
<polygon points="0 0, 10 3, 0 6" fill="#7f8c8d" />
</marker>
</defs>

<!-- Background -->
<rect width="1000" height="1400" fill="#f8f9fa"/>

<!-- Title -->
<text x="500" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
  Module 00: Complete AWS Traffic Flow
</text>
<text x="500" y="70" font-size="14" text-anchor="middle" fill="#7f8c8d">
  11-Layer Network Architecture - Request Journey
</text>

<!-- Request Path Arrow (Left) -->
<line x1="50" y1="150" x2="50" y2="1200" class="arrow"/>
<text x="30" y="650" font-size="12" fill="#7f8c8d" transform="rotate(-90 30 650)">REQUEST</text>

<!-- Response Path Arrow (Right) -->
<line x1="950" y1="1200" x2="950" y2="150" class="arrow"/>
<text x="970" y="650" font-size="12" fill="#7f8c8d" transform="rotate(90 970 650)">RESPONSE</text>

<!-- Layer 1: Route 53 (DNS) -->
<rect x="100" y="120" width="800" height="80" class="layer-box" fill="#FF9900"/>
<text x="500" y="150" text-anchor="middle" class="layer-title">Layer 1: Route 53 - DNS Resolution</text>
<text x="500" y="175" text-anchor="middle" class="layer-desc">Domain lookup, health checks, failover routing</text>
<text x="120" y="195" class="layer-desc">Command: nslookup | Resolve-DnsName</text>

<!-- Layer 2: CloudFront + WAF -->
<rect x="100" y="220" width="800" height="80" class="layer-box" fill="#FF6C6C"/>
<text x="500" y="250" text-anchor="middle" class="layer-title">Layer 2: CloudFront + WAF - CDN &amp; Security</text>
<text x="500" y="275" text-anchor="middle" class="layer-desc">Content caching, security filtering, DDoS protection</text>
<text x="120" y="295" class="layer-desc">Time: 2-5ms (hit) | 50-100ms (miss)</text>

<!-- Layer 3: ALB -->
<rect x="100" y="320" width="800" height="80" class="layer-box" fill="#146EB4"/>
<text x="500" y="350" text-anchor="middle" class="layer-title">Layer 3: Application Load Balancer - TLS Termination</text>
<text x="500" y="375" text-anchor="middle" class="layer-desc">HTTPS listener, path routing, SSL/TLS handshake</text>
<text x="120" y="395" class="layer-desc">Command: aws elbv2 describe-load-balancers</text>

<!-- Layer 4: VPC Routing -->
<rect x="100" y="420" width="800" height="80" class="layer-box" fill="#4B9BFF"/>
<text x="500" y="450" text-anchor="middle" class="layer-title">Layer 4: VPC &amp; Route Tables - Network Routing</text>
<text x="500" y="475" text-anchor="middle" class="layer-desc">Route table lookup, determine traffic path</text>
<text x="120" y="495" class="layer-desc">Command: aws ec2 describe-route-tables</text>

<!-- Layer 5: ALB Security Group -->
<rect x="100" y="520" width="800" height="80" class="layer-box" fill="#3DA5A5"/>
<text x="500" y="550" text-anchor="middle" class="layer-title">Layer 5: ALB Security Group - Inbound Firewall</text>
<text x="500" y="575" text-anchor="middle" class="layer-desc">Allow TCP 80, 443 from 0.0.0.0/0 (stateful)</text>
<text x="120" y="595" class="layer-desc">Command: Get-EC2SecurityGroup -GroupIds</text>

<!-- Layer 6: Target Group -->
<rect x="100" y="620" width="800" height="80" class="layer-box" fill="#47B881"/>
<text x="500" y="650" text-anchor="middle" class="layer-title">Layer 6: Target Group - Load Balancing</text>
<text x="500" y="675" text-anchor="middle" class="layer-desc">Health checks, distribute to healthy targets, round-robin</text>
<text x="120" y="695" class="layer-desc">Command: Get-ELBv2TargetHealth</text>

<!-- Layer 7: App Security Group -->
<rect x="100" y="720" width="800" height="80" class="layer-box" fill="#3DA5A5"/>
<text x="500" y="750" text-anchor="middle" class="layer-title">Layer 7: App Security Group - App Firewall</text>
<text x="500" y="775" text-anchor="middle" class="layer-desc">Allow TCP 8080 from ALB SG only (stateful)</text>
<text x="120" y="795" class="layer-desc">Command: Grant-EC2SecurityGroupIngress</text>

<!-- Layer 8: Application Server -->
<rect x="100" y="820" width="800" height="80" class="layer-box" fill="#FF9900"/>
<text x="500" y="850" text-anchor="middle" class="layer-title">Layer 8: Application Server - Business Logic</text>
<text x="500" y="875" text-anchor="middle" class="layer-desc">Process request, execute business logic, query database</text>
<text x="120" y="895" class="layer-desc">Time: 50-200ms (variable, depends on logic)</text>

<!-- Layer 9: RDS Database -->
<rect x="100" y="920" width="800" height="80" class="layer-box" fill="#527FFF"/>
<text x="500" y="950" text-anchor="middle" class="layer-title">Layer 9: RDS Database - Data Access</text>
<text x="500" y="975" text-anchor="middle" class="layer-desc">Encrypted MySQL/PostgreSQL connection, query execution</text>
<text x="120" y="995" class="layer-desc">Command: Test-NetConnection -Port 3306</text>

<!-- Layer 10: NAT Gateway -->
<rect x="100" y="1020" width="800" height="80" class="layer-box" fill="#4B9BFF"/>
<text x="500" y="1050" text-anchor="middle" class="layer-title">Layer 10: NAT Gateway - Egress Control</text>
<text x="500" y="1075" text-anchor="middle" class="layer-desc">Translate private IP to public, manage outbound traffic</text>
<text x="120" y="1095" class="layer-desc">Command: Get-EC2NatGateway</text>

<!-- Layer 11: Response Path -->
<rect x="100" y="1120" width="800" height="80" class="layer-box" fill="#47B881"/>
<text x="500" y="1150" text-anchor="middle" class="layer-title">Layer 11: Response Path - Return to User</text>
<text x="500" y="1175" text-anchor="middle" class="layer-desc">Reverse flow through all layers, cache response, render</text>
<text x="120" y="1195" class="layer-desc">Time: 200-500ms total (depends on cache &amp; DB)</text>

<!-- Key Metrics Box -->
<rect x="100" y="1230" width="800" height="120" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2" rx="8"/>
<text x="500" y="1260" text-anchor="middle" class="section-title">Performance Breakdown</text>
<text x="120" y="1290" class="layer-desc">• Cache Hit: ~100-200ms (CloudFront serves)</text>
<text x="120" y="1315" class="layer-desc">• Cache Miss: ~200-500ms (All layers involved)</text>
<text x="120" y="1340" class="layer-desc">• Database Query: 50-100ms | External API: 10-50ms | Security Checks: 1-10ms each</text>

<!-- Legend -->
<text x="100" y="1380" font-size="11" fill="#7f8c8d">
Request flows top-to-bottom (left arrow) | Response flows bottom-to-top (right arrow) | All layers must pass for successful request
</text>

</svg>