<svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="600" rx="14" fill="#14161B"/>
  <text x="480" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#F2F2F0">Secure Hybrid Network Architecture</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#9A9A96">Module 08 — Capstone — What You're Building</text>

  <!-- On-prem -->
  <rect x="30" y="90" width="260" height="440" rx="12" fill="#241708" stroke="#B0672A" stroke-width="1.2"/>
  <text x="50" y="114" font-size="12" font-weight="bold" fill="#E2924C">On-Premises</text>

  <rect x="46" y="126" width="228" height="60" rx="8" fill="#0E1A24" stroke="#3A6EA5" stroke-width="1"/>
  <text x="160" y="146" text-anchor="middle" font-size="10" font-weight="bold" fill="#7FB2E8">Customer Gateway</text>
  <text x="160" y="162" text-anchor="middle" font-size="9" fill="#9BB9D6">firewall / router</text>
  <text x="160" y="176" text-anchor="middle" font-size="8" fill="#9BB9D6">terminates the VPN</text>

  <rect x="46" y="196" width="228" height="46" rx="8" fill="#181A22" stroke="#847E96" stroke-width="0.8"/>
  <text x="160" y="216" text-anchor="middle" font-size="9" font-weight="bold" fill="#C7C7C2">Private IP range</text>
  <text x="160" y="232" text-anchor="middle" font-size="9" fill="#9A9A96">192.168.0.0/16</text>

  <rect x="46" y="252" width="228" height="46" rx="8" fill="#181A22" stroke="#847E96" stroke-width="0.8"/>
  <text x="160" y="272" text-anchor="middle" font-size="9" font-weight="bold" fill="#C7C7C2">BGP</text>
  <text x="160" y="288" text-anchor="middle" font-size="9" fill="#9A9A96">dynamic routing over VPN</text>

  <text x="160" y="340" text-anchor="middle" font-size="9" fill="#F0A96A">Dual IPsec tunnels</text>
  <text x="160" y="354" text-anchor="middle" font-size="8" fill="#C79063">active/active for real HA</text>
  <line x1="160" y1="360" x2="160" y2="500" stroke="#5FCB94" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- AWS Region -->
  <rect x="330" y="90" width="600" height="440" rx="12" fill="#0F1A14" stroke="#3E9E6F" stroke-width="1.2"/>
  <text x="350" y="114" font-size="12" font-weight="bold" fill="#5FCB94">▤ AWS — Amazon VPC (10.0.0.0/16)</text>

  <!-- TGW -->
  <rect x="590" y="126" width="220" height="70" rx="10" fill="#1A1526" stroke="#7A5CC7" stroke-width="1.3"/>
  <text x="700" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#A98FE0">◈ AWS Transit Gateway</text>
  <text x="700" y="168" text-anchor="middle" font-size="9" fill="#C6B4EE">central routing hub — no VPC peering</text>
  <path d="M290,330 L335,330 L335,160 L590,160" fill="none" stroke="#5FCB94" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Public/Private subnets -->
  <rect x="350" y="212" width="270" height="90" rx="10" fill="#0E1A24" stroke="#3A6EA5" stroke-width="1"/>
  <text x="368" y="234" font-size="10" font-weight="bold" fill="#7FB2E8">Public Subnet (multi-AZ)</text>
  <rect x="366" y="244" width="110" height="24" rx="8" fill="#0E2C4A" stroke="#3A6EA5" stroke-width="0.7"/>
  <text x="421" y="260" text-anchor="middle" font-size="9" fill="#7FB2E8">↑ Internet GW</text>
  <rect x="486" y="244" width="118" height="24" rx="8" fill="#241708" stroke="#B0672A" stroke-width="0.7"/>
  <text x="545" y="260" text-anchor="middle" font-size="9" fill="#E2924C">⇅ NAT Gateway</text>
  <text x="485" y="290" text-anchor="middle" font-size="8" fill="#9BB9D6">outbound-only for private subnets</text>

  <rect x="650" y="212" width="260" height="90" rx="10" fill="#181A22" stroke="#7FB2E8" stroke-width="1" opacity="0.9"/>
  <text x="668" y="234" font-size="10" font-weight="bold" fill="#7FB2E8">Private Subnet (multi-AZ)</text>
  <text x="780" y="256" text-anchor="middle" font-size="9" fill="#9BB9D6">application workloads</text>
  <text x="780" y="272" text-anchor="middle" font-size="9" fill="#9BB9D6">no inbound internet</text>

  <!-- Security layer -->
  <rect x="350" y="318" width="560" height="50" rx="10" fill="#2A2312" stroke="#B98A2E" stroke-width="1"/>
  <text x="630" y="340" text-anchor="middle" font-size="10" font-weight="bold" fill="#E2B04E">⛨ Security Groups (stateful) + Network ACLs (stateless)</text>
  <text x="630" y="358" text-anchor="middle" font-size="8" fill="#F0CC7E">enforced at every tier</text>

  <rect x="350" y="382" width="270" height="60" rx="10" fill="#2A2312" stroke="#B98A2E" stroke-width="1"/>
  <text x="485" y="404" text-anchor="middle" font-size="10" font-weight="bold" fill="#E2B04E">⚿ IAM Roles &amp; Policies</text>
  <text x="485" y="422" text-anchor="middle" font-size="9" fill="#F0CC7E">least-privilege access</text>

  <rect x="640" y="382" width="270" height="60" rx="10" fill="#1A1526" stroke="#7A5CC7" stroke-width="1"/>
  <text x="775" y="404" text-anchor="middle" font-size="10" font-weight="bold" fill="#A98FE0">◉ VPC Flow Logs + CloudTrail</text>
  <text x="775" y="422" text-anchor="middle" font-size="9" fill="#C6B4EE">traffic visibility, API audit</text>

  <text x="630" y="480" text-anchor="middle" font-size="9" fill="#847E96">Public and private subnets span multiple AZs for high availability</text>
  <text x="630" y="496" text-anchor="middle" font-size="9" fill="#847E96">All hybrid traffic routes through Transit Gateway</text>

  <circle cx="60" cy="560" r="5" fill="#B0672A"/><text x="72" y="564" font-size="9" fill="#C7C7C2">On-prem</text>
  <circle cx="180" cy="560" r="5" fill="#7A5CC7"/><text x="192" y="564" font-size="9" fill="#C7C7C2">Hub / routing</text>
  <circle cx="330" cy="560" r="5" fill="#3A6EA5"/><text x="342" y="564" font-size="9" fill="#C7C7C2">Network</text>
  <circle cx="460" cy="560" r="5" fill="#B98A2E"/><text x="472" y="564" font-size="9" fill="#C7C7C2">Security / IAM</text>
  <circle cx="620" cy="560" r="5" fill="#3E9E6F"/><text x="632" y="564" font-size="9" fill="#C7C7C2">VPC envelope</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9A9A96"/>
    </marker>
  </defs>
</svg>
