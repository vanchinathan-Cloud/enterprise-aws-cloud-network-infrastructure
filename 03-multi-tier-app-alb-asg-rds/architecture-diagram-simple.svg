<svg width="1040" height="800" viewBox="0 0 1040 800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="1040" height="800" rx="14" fill="#14161B"/>

  <!-- Title -->
  <text x="520" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#F2F2F0">Three-Tier HA Web App with Multi-Region DR</text>
  <text x="520" y="60" text-anchor="middle" font-size="12" fill="#9A9A96">Module 03 — What You're Building</text>

  <!-- Internet -->
  <text x="520" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#D6D6D2">☁ Internet users</text>
  <line x1="520" y1="98" x2="520" y2="122" stroke="#6B6B66" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Edge row -->
  <rect x="70" y="122" width="900" height="46" rx="8" fill="#231C0F" stroke="#B98A2E" stroke-width="1"/>
  <text x="520" y="150" text-anchor="middle" font-size="12" fill="#E2B04E">⛨ Route 53 → AWS WAF → CloudFront (global edge)</text>

  <!-- Primary Region container -->
  <rect x="40" y="192" width="560" height="560" rx="12" fill="#1B1E24" stroke="#3A6EA5" stroke-width="1"/>
  <text x="60" y="216" font-size="12" font-weight="bold" fill="#7FB2E8">◱ AWS Region: us-east-1 (Primary)</text>

  <!-- VPC container -->
  <rect x="58" y="228" width="524" height="500" rx="10" fill="#0F1A14" stroke="#3E9E6F" stroke-width="1.2"/>
  <text x="76" y="250" font-size="12" font-weight="bold" fill="#5FCB94">▤ VPC — app-vpc (10.0.0.0/16)</text>

  <rect x="76" y="262" width="488" height="30" rx="6" fill="#241708" stroke="#B0672A" stroke-width="0.8"/>
  <text x="520" y="282" text-anchor="middle" font-size="11" fill="#E2924C">↑ Internet Gateway — routes to public subnets</text>

  <!-- AZ A / AZ B labels -->
  <text x="185" y="310" text-anchor="middle" font-size="10" fill="#C7C7C2">Availability Zone A (us-east-1a)</text>
  <text x="455" y="310" text-anchor="middle" font-size="10" fill="#C7C7C2">Availability Zone B (us-east-1b)</text>
  <rect x="90" y="318" width="190" height="392" rx="8" fill="none" stroke="#4A4A46" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="360" y="318" width="190" height="392" rx="8" fill="none" stroke="#4A4A46" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Public subnets -->
  <rect x="100" y="328" width="170" height="56" rx="8" fill="#0F1A14" stroke="#3E9E6F" stroke-width="1"/>
  <text x="112" y="346" font-size="10" font-weight="bold" fill="#5FCB94">Public Subnet</text>
  <rect x="112" y="354" width="72" height="20" rx="10" fill="#0E2C4A" stroke="#3A6EA5" stroke-width="0.8"/>
  <text x="148" y="368" text-anchor="middle" font-size="9" fill="#7FB2E8">▣ ALB node</text>
  <rect x="188" y="354" width="70" height="20" rx="10" fill="#241708" stroke="#B0672A" stroke-width="0.8"/>
  <text x="223" y="368" text-anchor="middle" font-size="9" fill="#E2924C">⇅ NAT GW</text>

  <rect x="370" y="328" width="170" height="56" rx="8" fill="#0F1A14" stroke="#3E9E6F" stroke-width="1"/>
  <text x="382" y="346" font-size="10" font-weight="bold" fill="#5FCB94">Public Subnet</text>
  <rect x="382" y="354" width="72" height="20" rx="10" fill="#0E2C4A" stroke="#3A6EA5" stroke-width="0.8"/>
  <text x="418" y="368" text-anchor="middle" font-size="9" fill="#7FB2E8">▣ ALB node</text>

  <!-- ASG band -->
  <rect x="90" y="396" width="460" height="24" rx="6" fill="#0E2C4A" stroke="#3A6EA5" stroke-width="0.8"/>
  <text x="320" y="412" text-anchor="middle" font-size="10" fill="#7FB2E8">⟳ Auto Scaling Group · min:2 desired:3 max:10 · self-heals</text>

  <!-- App private subnets -->
  <rect x="100" y="430" width="170" height="70" rx="8" fill="#0E1A24" stroke="#3A6EA5" stroke-width="1"/>
  <text x="112" y="448" font-size="10" font-weight="bold" fill="#7FB2E8">App Private Subnet</text>
  <rect x="112" y="456" width="70" height="20" rx="10" fill="#241708" stroke="#B0672A" stroke-width="0.8"/>
  <text x="147" y="470" text-anchor="middle" font-size="9" fill="#E2924C">▥ EC2</text>
  <rect x="186" y="456" width="70" height="20" rx="10" fill="#2A2312" stroke="#B98A2E" stroke-width="0.8"/>
  <text x="221" y="470" text-anchor="middle" font-size="9" fill="#E2B04E">⚿ IAM role</text>

  <rect x="370" y="430" width="170" height="70" rx="8" fill="#0E1A24" stroke="#3A6EA5" stroke-width="1"/>
  <text x="382" y="448" font-size="10" font-weight="bold" fill="#7FB2E8">App Private Subnet</text>
  <rect x="382" y="456" width="70" height="20" rx="10" fill="#241708" stroke="#B0672A" stroke-width="0.8"/>
  <text x="417" y="470" text-anchor="middle" font-size="9" fill="#E2924C">▥ EC2</text>
  <rect x="456" y="456" width="70" height="20" rx="10" fill="#2A2312" stroke="#B98A2E" stroke-width="0.8"/>
  <text x="491" y="470" text-anchor="middle" font-size="9" fill="#E2B04E">⚿ IAM role</text>

  <!-- DB Subnet Group -->
  <rect x="90" y="516" width="460" height="180" rx="8" fill="none" stroke="#7A5CC7" stroke-width="1"/>
  <text x="102" y="536" font-size="10" font-weight="bold" fill="#A98FE0">DB Subnet Group</text>

  <rect x="100" y="546" width="170" height="140" rx="8" fill="#1A1526" stroke="#7A5CC7" stroke-width="1"/>
  <text x="112" y="564" font-size="10" font-weight="bold" fill="#A98FE0">DB Private Subnet</text>
  <rect x="112" y="574" width="146" height="24" rx="10" fill="#241534" stroke="#7A5CC7" stroke-width="0.8"/>
  <text x="185" y="590" text-anchor="middle" font-size="9" fill="#C6B4EE">◈ RDS MySQL (Multi-AZ)</text>
  <rect x="112" y="606" width="146" height="24" rx="10" fill="#181A22" stroke="#3A6EA5" stroke-width="0.8"/>
  <text x="185" y="622" text-anchor="middle" font-size="9" fill="#7FB2E8">◆ ElastiCache Redis</text>

  <rect x="370" y="546" width="170" height="140" rx="8" fill="#1A1526" stroke="#7A5CC7" stroke-width="1" opacity="0.55"/>
  <text x="382" y="564" font-size="10" font-weight="bold" fill="#A98FE0">DB Private Subnet</text>
  <text x="455" y="620" text-anchor="middle" font-size="9" fill="#847E96">Standby / read replica</text>

  <!-- Bottom shared services row inside VPC -->
  <rect x="76" y="706" width="240" height="34" rx="8" fill="#241708" stroke="#B0672A" stroke-width="0.8"/>
  <text x="196" y="727" text-anchor="middle" font-size="9" fill="#E2924C">▤ S3 — static assets &amp; runtime bucket</text>
  <rect x="326" y="706" width="238" height="34" rx="8" fill="#2A2312" stroke="#B98A2E" stroke-width="0.8"/>
  <text x="445" y="727" text-anchor="middle" font-size="9" fill="#E2B04E">⚿ Secrets Manager — DB password</text>

  <!-- DR Region container -->
  <rect x="620" y="192" width="380" height="560" rx="12" fill="#1B1E24" stroke="#C7793C" stroke-width="1"/>
  <text x="640" y="216" font-size="12" font-weight="bold" fill="#E2924C">◱ AWS Region: us-west-2 (DR — warm standby)</text>

  <rect x="638" y="228" width="344" height="500" rx="10" fill="#241708" stroke="#B0672A" stroke-width="1.2"/>
  <text x="656" y="250" font-size="12" font-weight="bold" fill="#E2924C">▤ VPC — dr-vpc (10.1.0.0/16)</text>

  <rect x="656" y="270" width="308" height="50" rx="8" fill="#0E2C4A" stroke="#3A6EA5" stroke-width="1"/>
  <text x="810" y="292" text-anchor="middle" font-size="10" fill="#7FB2E8">▣ ALB (DR)</text>

  <rect x="656" y="332" width="308" height="60" rx="8" fill="#0E1A24" stroke="#3A6EA5" stroke-width="1"/>
  <text x="810" y="352" text-anchor="middle" font-size="10" font-weight="bold" fill="#7FB2E8">EC2 Auto Scaling Group</text>
  <text x="810" y="370" text-anchor="middle" font-size="9" fill="#9BB9D6">min:1 max:6 (scales out on failover)</text>

  <rect x="656" y="404" width="150" height="60" rx="8" fill="#1A1526" stroke="#7A5CC7" stroke-width="1"/>
  <text x="731" y="424" text-anchor="middle" font-size="9" font-weight="bold" fill="#A98FE0">RDS Read Replica</text>
  <text x="731" y="440" text-anchor="middle" font-size="9" fill="#C6B4EE">promotable</text>

  <rect x="814" y="404" width="150" height="60" rx="8" fill="#181A22" stroke="#3A6EA5" stroke-width="1"/>
  <text x="889" y="424" text-anchor="middle" font-size="9" font-weight="bold" fill="#7FB2E8">ElastiCache</text>
  <text x="889" y="440" text-anchor="middle" font-size="9" fill="#9BB9D6">Redis (DR)</text>

  <rect x="656" y="480" width="308" height="40" rx="8" fill="#241708" stroke="#B0672A" stroke-width="0.8"/>
  <text x="810" y="504" text-anchor="middle" font-size="9" fill="#E2924C">▤ S3 — cross-region replica (CRR)</text>

  <text x="810" y="560" text-anchor="middle" font-size="9" fill="#847E96">RTO &lt; 15 min · RPO &lt; 5 min · 99.99% availability</text>

  <!-- Failover + replication arrows -->
  <line x1="580" y1="145" x2="900" y2="168" stroke="#B0672A" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="770" y="165" font-size="9" fill="#C7793C">Failover if primary unhealthy</text>

  <line x1="582" y1="616" x2="638" y2="616" stroke="#847E96" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="610" y="608" text-anchor="middle" font-size="8" fill="#847E96">sync</text>

  <!-- Legend -->
  <rect x="40" y="760" width="1000" height="30" rx="8" fill="none"/>
  <circle cx="60" cy="775" r="5" fill="#3A6EA5"/><text x="72" y="779" font-size="9" fill="#C7C7C2">Networking / compute</text>
  <circle cx="220" cy="775" r="5" fill="#B0672A"/><text x="232" y="779" font-size="9" fill="#C7C7C2">Storage / gateway</text>
  <circle cx="360" cy="775" r="5" fill="#7A5CC7"/><text x="372" y="779" font-size="9" fill="#C7C7C2">Data tier</text>
  <circle cx="470" cy="775" r="5" fill="#B98A2E"/><text x="482" y="779" font-size="9" fill="#C7C7C2">Security / IAM</text>
  <circle cx="610" cy="775" r="5" fill="#C7793C"/><text x="622" y="779" font-size="9" fill="#C7C7C2">DR region resources</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9A9A96"/>
    </marker>
  </defs>
</svg>
