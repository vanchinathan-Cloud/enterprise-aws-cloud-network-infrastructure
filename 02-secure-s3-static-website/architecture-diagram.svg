<svg width="820" height="560" viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="820" height="560" rx="14" fill="#14161B"/>
  <text x="410" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#F2F2F0">Secure S3 Static Website</text>
  <text x="410" y="56" text-anchor="middle" font-size="12" fill="#9A9A96">Module 02 — What You're Building</text>

  <text x="410" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#D6D6D2">☁ Internet users</text>
  <line x1="410" y1="90" x2="410" y2="112" stroke="#6B6B66" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="290" y="112" width="240" height="32" rx="8" fill="#1A1526" stroke="#7A5CC7" stroke-width="1"/>
  <text x="410" y="133" text-anchor="middle" font-size="11" fill="#A98FE0">◱ Route 53 — DNS Alias record</text>
  <line x1="410" y1="144" x2="410" y2="166" stroke="#6B6B66" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="270" y="166" width="280" height="32" rx="8" fill="#2A2312" stroke="#B98A2E" stroke-width="1"/>
  <text x="410" y="187" text-anchor="middle" font-size="11" fill="#E2B04E">⚿ ACM Certificate (us-east-1, TLS)</text>
  <line x1="410" y1="198" x2="410" y2="220" stroke="#6B6B66" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="220" width="460" height="120" rx="10" fill="#0E1A24" stroke="#3A6EA5" stroke-width="1.2"/>
  <text x="200" y="242" font-size="12" font-weight="bold" fill="#7FB2E8">▣ CloudFront Distribution</text>
  <text x="200" y="260" font-size="10" fill="#9BB9D6">HTTPS termination, edge caching, custom domain</text>
  <rect x="200" y="270" width="200" height="26" rx="8" fill="#0E2C4A" stroke="#3A6EA5" stroke-width="0.8"/>
  <text x="300" y="287" text-anchor="middle" font-size="9" fill="#7FB2E8">⧉ Origin Access Control (OAC)</text>
  <rect x="412" y="270" width="208" height="26" rx="8" fill="#0E2C4A" stroke="#3A6EA5" stroke-width="0.8"/>
  <text x="516" y="287" text-anchor="middle" font-size="9" fill="#7FB2E8">⚡ CloudFront Function (redirects)</text>
  <text x="410" y="316" text-anchor="middle" font-size="9" fill="#9BB9D6">Signs requests to S3 — only CloudFront can fetch objects</text>

  <line x1="410" y1="340" x2="410" y2="362" stroke="#6B6B66" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="200" y="362" width="420" height="130" rx="10" fill="#241708" stroke="#B0672A" stroke-width="1.2"/>
  <text x="220" y="386" font-size="12" font-weight="bold" fill="#E2924C">▤ S3 Bucket (private)</text>
  <text x="220" y="404" font-size="10" fill="#F0A96A">Block Public Access = ON (all four settings)</text>
  <rect x="220" y="414" width="380" height="30" rx="8" fill="#2A1608" stroke="#B0672A" stroke-width="0.8"/>
  <text x="410" y="433" text-anchor="middle" font-size="9" fill="#E2924C">Bucket Policy — scoped to this CloudFront distribution only</text>
  <text x="410" y="466" text-anchor="middle" font-size="9" fill="#C79063">Direct bucket URL access → 403 Access Denied</text>

  <line x1="140" y1="280" x2="180" y2="280" stroke="#B32F2F" stroke-width="2"/>
  <line x1="140" y1="270" x2="140" y2="290" stroke="#B32F2F" stroke-width="2"/>
  <text x="90" y="284" text-anchor="middle" font-size="9" fill="#D66B6B">✕ No public</text>
  <text x="90" y="296" text-anchor="middle" font-size="9" fill="#D66B6B">access path</text>

  <circle cx="240" cy="524" r="5" fill="#7A5CC7"/><text x="252" y="528" font-size="9" fill="#C7C7C2">DNS / Certs</text>
  <circle cx="380" cy="524" r="5" fill="#3A6EA5"/><text x="392" y="528" font-size="9" fill="#C7C7C2">Edge / CDN</text>
  <circle cx="500" cy="524" r="5" fill="#B0672A"/><text x="512" y="528" font-size="9" fill="#C7C7C2">Storage (private)</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9A9A96"/>
    </marker>
  </defs>
</svg>
