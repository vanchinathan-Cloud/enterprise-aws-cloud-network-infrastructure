<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="620" rx="14" fill="#14161B"/>
  <text x="450" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#F2F2F0">Transit Gateway Hub-and-Spoke</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#9A9A96">Module 04 — What You're Building</text>

  <!-- Hub -->
  <rect x="330" y="240" width="240" height="110" rx="12" fill="#1A1526" stroke="#7A5CC7" stroke-width="1.4"/>
  <text x="450" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#A98FE0">◈ Transit Gateway</text>
  <text x="450" y="284" text-anchor="middle" font-size="9" fill="#C6B4EE">Regional hub — routes between attachments</text>
  <rect x="350" y="292" width="200" height="24" rx="8" fill="#241534" stroke="#7A5CC7" stroke-width="0.8"/>
  <text x="450" y="308" text-anchor="middle" font-size="9" fill="#A98FE0">☰ TGW Route Table</text>
  <text x="450" y="330" text-anchor="middle" font-size="8" fill="#847E96">Association: THIS attachment's traffic</text>
  <text x="450" y="342" text-anchor="middle" font-size="8" fill="#847E96">Propagation: routes FROM an attachment</text>

  <!-- Spoke A -->
  <rect x="40" y="60" width="240" height="130" rx="10" fill="#0F1A14" stroke="#3E9E6F" stroke-width="1.2"/>
  <text x="60" y="84" font-size="12" font-weight="bold" fill="#5FCB94">▤ VPC A — 10.0.0.0/16</text>
  <text x="60" y="102" font-size="9" fill="#9BCBAA">Prod workloads</text>
  <rect x="60" y="112" width="200" height="24" rx="8" fill="#181A22" stroke="#847E96" stroke-width="0.8"/>
  <text x="160" y="128" text-anchor="middle" font-size="9" fill="#C7C7C2">☰ VPC Route Table → TGW</text>
  <rect x="60" y="144" width="200" height="24" rx="8" fill="#0E1A24" stroke="#3A6EA5" stroke-width="0.8"/>
  <text x="160" y="160" text-anchor="middle" font-size="9" fill="#7FB2E8">⧉ TGW Attachment</text>

  <!-- Spoke B -->
  <rect x="620" y="60" width="240" height="130" rx="10" fill="#241708" stroke="#B0672A" stroke-width="1.2"/>
  <text x="640" y="84" font-size="12" font-weight="bold" fill="#E2924C">▤ VPC B — 10.1.0.0/16</text>
  <text x="640" y="102" font-size="9" fill="#F0A96A">Shared services</text>
  <rect x="640" y="112" width="200" height="24" rx="8" fill="#181A22" stroke="#847E96" stroke-width="0.8"/>
  <text x="740" y="128" text-anchor="middle" font-size="9" fill="#C7C7C2">☰ VPC Route Table → TGW</text>
  <rect x="640" y="144" width="200" height="24" rx="8" fill="#0E1A24" stroke="#3A6EA5" stroke-width="0.8"/>
  <text x="740" y="160" text-anchor="middle" font-size="9" fill="#7FB2E8">⧉ TGW Attachment</text>

  <!-- Spoke C -->
  <rect x="330" y="430" width="240" height="130" rx="10" fill="#2A2312" stroke="#B98A2E" stroke-width="1.2"/>
  <text x="350" y="454" font-size="12" font-weight="bold" fill="#E2B04E">▤ VPC C — 10.2.0.0/16</text>
  <text x="350" y="472" font-size="9" fill="#F0CC7E">Dev / test</text>
  <rect x="350" y="482" width="200" height="24" rx="8" fill="#181A22" stroke="#847E96" stroke-width="0.8"/>
  <text x="450" y="498" text-anchor="middle" font-size="9" fill="#C7C7C2">☰ VPC Route Table → TGW</text>
  <rect x="350" y="514" width="200" height="24" rx="8" fill="#0E1A24" stroke="#3A6EA5" stroke-width="0.8"/>
  <text x="450" y="530" text-anchor="middle" font-size="9" fill="#7FB2E8">⧉ TGW Attachment</text>

  <line x1="280" y1="140" x2="356" y2="256" stroke="#5FCB94" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="620" y1="140" x2="544" y2="256" stroke="#E2924C" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="450" y1="350" x2="450" y2="430" stroke="#E2B04E" stroke-width="1.3" marker-end="url(#arrow)"/>

  <circle cx="60" cy="590" r="5" fill="#3E9E6F"/><text x="72" y="594" font-size="9" fill="#C7C7C2">Spoke — Prod</text>
  <circle cx="230" cy="590" r="5" fill="#B0672A"/><text x="242" y="594" font-size="9" fill="#C7C7C2">Spoke — Shared svc</text>
  <circle cx="420" cy="590" r="5" fill="#B98A2E"/><text x="432" y="594" font-size="9" fill="#C7C7C2">Spoke — Dev</text>
  <circle cx="580" cy="590" r="5" fill="#7A5CC7"/><text x="592" y="594" font-size="9" fill="#C7C7C2">Hub — TGW</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9A9A96"/>
    </marker>
  </defs>
</svg>
